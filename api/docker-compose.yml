# Docker Compose configuration for Rossmann Sales Forecasting API
# Run from project root: docker-compose -f api/docker-compose.yml up

version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: rossmann-api
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
      - ../logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

